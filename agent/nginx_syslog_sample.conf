# ====================================================================
# MITHRIL SIEM - Configuración de Ejemplo para Nginx (Ubuntu / Rocky Linux)
# ====================================================================

# --------------------------------------------------------------------
# PASO 1: Formato JSON estructurado
# Ubicación habitual: dentro de 'http { ... }' en /etc/nginx/nginx.conf
# o en un archivo /etc/nginx/conf.d/mithril_format.conf
# --------------------------------------------------------------------
log_format mithril_json escape=json '{'
    '"client_ip":"$remote_addr",'
    '"time_local":"$time_iso8601",'
    '"http_method":"$request_method",'
    '"uri":"$uri",'
    '"query_params":"$args",'
    '"status_code":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"latency_ms":$request_time,'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
'}';

# --------------------------------------------------------------------
# PASO 2: Configuración en el bloque de tu servidor virtual (VirtualHost)
# Ubicación habitual:
#   Ubuntu / Debian : /etc/nginx/sites-available/tu_sitio (o /etc/nginx/conf.d/)
#   Rocky / RHEL    : /etc/nginx/conf.d/tu_sitio.conf
# --------------------------------------------------------------------
server {
    listen 80;
    server_name proxy.tu-empresa.com;

    # 1. Inclusión de la lista negra dinámica gestionada por Mithril Bouncer
    #    (Si usas BLOCK_METHOD=ipset este include es opcional, pero se recomienda como doble capa)
    include /etc/nginx/conf.d/mithril_blocklist.conf;

    # 2. Envío de logs en tiempo real vía Syslog UDP directo al SIEM (puerto 5140)
    #    Sustituye 192.168.1.100 por la IP donde corre tu servidor Mithril SIEM
    access_log syslog:server=192.168.1.100:5140,facility=local7,tag=nginx mithril_json;

    # Log local estándar de respaldo (opcional)
    # access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080; # O la IP de tu backend/servidor de aplicaciones
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
