# ====================================================================
# MITHRIL SIEM - Configuración de Ejemplo para Servidores Nginx
# ====================================================================

# 1. Definición del formato JSON estructurado
log_format mithril_json escape=json '{'
    '"client_ip":"$remote_addr",'
    '"time_local":"$time_iso8601",'
    '"http_method":"$request_method",'
    '"uri":"$uri",'
    '"query_params":"$args",'
    '"status_code":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"latency_ms":$request_time,'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
'}';

server {
    listen 80;
    server_name tu-dominio.com;

    # 2. Inclusión de la lista negra dinámica administrada por Mithril Bouncer
    include /etc/nginx/conf.d/mithril_blocklist.conf;

    # 3. Emisión directa en tiempo real sin escribir a disco (Syslog o Socket local)
    # Reemplaza 192.168.1.100 por la IP de tu servidor Mithril SIEM o Vector/FluentBit local
    access_log syslog:server=192.168.1.100:5140,facility=local7,tag=nginx mithril_json;

    location / {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
