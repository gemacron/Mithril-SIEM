# ====================================================================
# MITHRIL SIEM - Configuración Recomendada para Nginx (con Cloudflare)
# ====================================================================

# --------------------------------------------------------------------
# PASO 1: Restaurar la IP Real del Cliente detrás de Cloudflare
# Ubicación: dentro de 'http { ... }' en /etc/nginx/nginx.conf
# o en un archivo dedicado /etc/nginx/conf.d/cloudflare_realip.conf
# --------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# --------------------------------------------------------------------
# PASO 2: Formato JSON estructurado para Syslog UDP con cabeceras de origen
# --------------------------------------------------------------------
log_format mithril_json escape=json '{'
    '"client_ip":"$remote_addr",'
    '"real_client_ip":"$http_cf_connecting_ip",'
    '"cf_country":"$http_cf_ipcountry",'
    '"cf_ray":"$http_cf_ray",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"time_local":"$time_iso8601",'
    '"http_method":"$request_method",'
    '"uri":"$uri",'
    '"query_params":"$args",'
    '"status_code":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"latency_ms":$request_time,'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
'}';

# --------------------------------------------------------------------
# PASO 2: Configuración en el bloque de tu servidor virtual (VirtualHost)
# Ubicación habitual:
#   Ubuntu / Debian : /etc/nginx/sites-available/tu_sitio (o /etc/nginx/conf.d/)
#   Rocky / RHEL    : /etc/nginx/conf.d/tu_sitio.conf
# --------------------------------------------------------------------
server {
    listen 80;
    server_name proxy.tu-empresa.com;

    # 1. Inclusión de la lista negra dinámica gestionada por Mithril Bouncer
    #    (Si usas BLOCK_METHOD=ipset este include es opcional, pero se recomienda como doble capa)
    include /etc/nginx/conf.d/mithril_blocklist.conf;

    # 2. Envío de logs en tiempo real vía Syslog UDP directo al SIEM (puerto 5140)
    #    Sustituye 192.168.1.100 por la IP donde corre tu servidor Mithril SIEM
    access_log syslog:server=192.168.1.100:5140,facility=local7,tag=nginx mithril_json;

    # Log local estándar de respaldo (opcional)
    # access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080; # O la IP de tu backend/servidor de aplicaciones
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
