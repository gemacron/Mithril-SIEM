{% extends 'base.html' %}

{% block title %}Alta de Servidor Proxy Nginx{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 1.5rem auto;">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <span>+</span> ALTA DE NUEVO NODO PROXY NGINX
      </div>
      <a href="{% url 'nodes:list' %}" class="btn btn-dim" style="padding: 0.25rem 0.6rem;">&larr; Volver</a>
    </div>

    <div class="panel-body">
      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label class="form-label" for="name">Nombre Identificador del Proxy</label>
          <input type="text" id="name" name="name" class="form-input" required placeholder="ej: proxy-edge-us-01">
          <small style="color: var(--text-dim); font-size: 0.7rem;">Un nombre único y descriptivo para ubicar el servidor.</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="ip_address">Dirección IP del Proxy</label>
          <input type="text" id="ip_address" name="ip_address" class="form-input" required placeholder="ej: 198.51.100.25">
        </div>

        <div class="form-group">
          <label class="form-label" for="location_label">Ubicación / Región</label>
          <input type="text" id="location_label" name="location_label" class="form-input" placeholder="ej: Frankfurt, Alemania (Datacenter A)">
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Notas o Descripción Opcional</label>
          <textarea id="description" name="description" class="form-input" rows="3" placeholder="Detalles de aplicaciones proxificadas detrás de este Nginx..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <a href="{% url 'nodes:list' %}" class="btn btn-dim">Cancelar</a>
          <button type="submit" class="btn btn-cyan">Crear y Generar Token</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
